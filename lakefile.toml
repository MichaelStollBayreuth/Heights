name = "Heights"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Heights"]
# The files here predate the module system (several are `#exit`-truncated scratch and archive
# material); this silences Lake's "consider adding `module`" warning on every Mathlib import.
allowNonModules = true

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "Heights"
# The explicit "Heights" glob elaborates the root module itself; with only the ".+" submodule
# glob a broken import line in `Heights.lean` would go unnoticed.
globs = ["Heights", "Heights.+"]
